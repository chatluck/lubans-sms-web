<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ScoreHub 账号·一键获取</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14171c; --panel2:#1b1f26; --line:#272c35;
    --text:#e9ecf1; --muted:#8b94a3; --accent:#6e38f5; --accent2:#8b5cff;
    --ok:#38c172; --warn:#f0a020; --err:#ef4b6d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1a1330 0%,var(--bg) 60%);color:var(--text);
       font:14px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:48px 20px 80px}
  header{text-align:center;margin-bottom:28px}
  h1{margin:0 0 8px;font-size:26px;letter-spacing:.5px}
  header p{margin:0;color:var(--muted);font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
  .card h2{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:600}
  label{display:block;font-size:12px;color:var(--muted);margin:4px 0 6px}
  input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 13px;font:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  .main-btn{width:100%;margin-top:8px;padding:18px;border:0;border-radius:14px;cursor:pointer;font:600 16px/1 inherit;
    color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 10px 30px -10px rgba(110,56,245,.8);transition:transform .12s,opacity .2s}
  .main-btn:hover{transform:translateY(-1px)}
  .main-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .hint{color:var(--muted);font-size:12px;margin-top:10px;text-align:center}
  .result{margin-top:16px;display:none}
  .result.show{display:block}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--panel2);
       border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
  .row:last-child{margin-bottom:0}
  .row .k{color:var(--muted);font-size:12px}
  .row .v{font:600 15px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
  .copy{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;
        font:12px inherit;cursor:pointer;white-space:nowrap}
  .copy:hover{color:var(--text);border-color:var(--accent)}
  .log{font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);max-height:180px;overflow:auto;white-space:pre-wrap}
  .tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--muted)}
  .tag.on{color:var(--ok);border-color:rgba(56,193,114,.45)}
  .tag.err{color:var(--err);border-color:rgba(239,75,109,.45)}
  .tag.warn{color:var(--warn);border-color:rgba(240,160,32,.45)}
  .hist{font-size:12px;color:var(--muted)}
  .hist div{padding:6px 0;border-bottom:1px solid var(--line)}
  .hist div:last-child{border-bottom:0}
  .hist b{color:var(--text);font-family:ui-monospace,Menlo,monospace;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ScoreHub 账号 · 一键获取</h1>
    <p>点一下，自动取号 → 收码 → 注册 → 设密码 → 返回可用账号</p>
  </header>

  <div class="card">
    <h2>获取账号</h2>
    <button class="main-btn" id="go">获取账号</button>
    <div class="hint" id="tip">手机号 + 密码会自动生成，约 20–90 秒</div>

    <div class="result" id="result">
      <div class="row"><div><div class="k">账号（手机号）</div><div class="v" id="rPhone">—</div></div><button class="copy" data-copy="rPhone">复制</button></div>
      <div class="row"><div><div class="k">密码</div><div class="v" id="rPwd">—</div></div><button class="copy" data-copy="rPwd">复制</button></div>
      <div class="row"><div><div class="k">商户名称</div><div class="v" id="rName">—</div></div><button class="copy" data-copy="rName">复制</button></div>
      <div class="row"><div><div class="k">登录入口</div><div class="v"><a href="https://app.scorehub.cn/merchant/login" target="_blank" rel="noreferrer" style="color:#8b5cff">app.scorehub.cn/merchant/login</a></div></div><button class="copy" data-copy-url>复制</button></div>
    </div>
  </div>

  <div class="card">
    <h2>进度</h2>
    <div><span class="tag" id="state">待机</span></div>
    <div class="log" id="log" style="margin-top:12px">—</div>
  </div>

  <div class="card">
    <h2>本次获取记录</h2>
    <div class="hist" id="hist">暂无</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const LS = "scorehub-autoreg";
const MAX_TRY = 12;
const MAX_POLL = 3;
const DEFAULT_API = "https://scorehub-autoreg.pages.dev";

function log(msg){
  const t = new Date().toLocaleTimeString();
  $("log").textContent = `[${t}] ${msg}\n` + ($("log").textContent === "—" ? "" : $("log").textContent);
}
function state(txt, cls){
  const el = $("state");
  el.textContent = txt;
  el.className = "tag " + (cls || "");
}
function load(){
  renderHist();
}

async function api(path, opts){
  let res;
  try {
    res = await fetch(DEFAULT_API + path, opts);
  } catch(e){
    throw new Error("网络超时，重试中");
  }
  const text = await res.text();
  if(!text){ throw new Error("平台响应超时（30s）"); }
  try { return JSON.parse(text); } catch(e){ throw new Error("响应异常：" + text.slice(0,80)); }
}

async function once(){
  const s = await api("/api/start", {method:"POST"});
  if(s.status !== "started") throw new Error(s.message || "取号失败");
  const phone = s.phone;
  log("取号 " + phone + "，等待号码激活…");
  if(s.replaced && s.replaced.length) log("已释放低质量号段：" + s.replaced.join(", "));
  state("激活号码", "warn");

  await countdown(20);

  log("触发短信发送…");
  const sent = await api("/api/send?phone=" + encodeURIComponent(phone));
  if(sent.status !== "sent"){ log("发码失败：" + (sent.message||"") + "，换号重试"); return null; }
  state("等待验证码", "warn");

  for(let i=0;i<MAX_POLL;i++){
    const p = await api("/api/poll?phone=" + encodeURIComponent(phone));
    if(p.status === "waiting"){ log("轮询 " + (i+1) + "/" + MAX_POLL + " 未收到"); continue; }
    if(p.status === "blocked"){ log("号码被屏蔽，释放换号"); await release(phone); return null; }
    if(p.status === "ok"){ log("注册成功：" + p.phone); return p; }
    log("异常：" + (p.message||p.status)); await release(phone); return null;
  }
  log("3 次轮询无码，释放 " + phone + " 换号");
  await release(phone);
  return null;
}

async function release(phone){
  try { await api("/api/release?phone=" + encodeURIComponent(phone)); } catch(e){ /* 忽略 */ }
}

function countdown(sec){
  return new Promise(resolve => {
    let left = sec;
    const tick = () => {
      $("tip").textContent = "号码激活中，还剩 " + left + "s（等待可显著提高到达率）";
      if(left-- <= 0){ $("tip").textContent = "手机号 + 密码会自动生成，约 20–90 秒"; resolve(); return; }
      setTimeout(tick, 1000);
    };
    tick();
  });
}

async function go(){
  $("go").disabled = true;
  $("result").classList.remove("show");
  try{
    for(let t=1;t<=MAX_TRY;t++){
      state("获取中（第 " + t + "/" + MAX_TRY + " 次）", "warn");
      log("=== 第 " + t + " 次尝试 ===");
      let r = null;
      let errMsg = "";
      try { r = await once(); } catch(e){ errMsg = e.message || ""; log("失败：" + errMsg); }
      if(!r && t < MAX_TRY){
        const limited = /操作太快|限速/.test(errMsg);
        const wait = limited ? 20000 : 4000;
        log("等待 " + (wait/1000) + "s 后重试" + (limited ? "（平台限速）" : ""));
        await new Promise(res=>setTimeout(res, wait));
      }
      if(r){
        $("rPhone").textContent = r.phone;
        $("rPwd").textContent = r.password;
        $("rName").textContent = r.merchantName || ("Score" + r.phone);
        $("result").classList.add("show");
        state("已完成", "on");
        saveHist(r);
        return;
      }
    }
    state("未取到账号", "err");
    log("三次尝试均未成功，稍后再试（号码池可能被屏蔽）");
  }catch(e){
    state("出错", "err");
    log("错误：" + e.message);
  }finally{
    $("go").disabled = false;
  }
}

function saveHist(r){
  const list = JSON.parse(localStorage.getItem(LS + ":hist") || "[]");
  list.unshift({...r, at: Date.now()});
  localStorage.setItem(LS + ":hist", JSON.stringify(list.slice(0, 20)));
  renderHist();
}
function renderHist(){
  const list = JSON.parse(localStorage.getItem(LS + ":hist") || "[]");
  $("hist").innerHTML = list.length
    ? list.map(x => `<div>${new Date(x.at).toLocaleString()} · <b>${x.phone}</b> · <b>${x.password}</b> · ${x.merchantName||""}</div>`).join("")
    : "暂无";
}

document.querySelectorAll(".copy").forEach(btn => {
  btn.onclick = async () => {
    const target = btn.dataset.copy;
    const text = target ? $(target).textContent : "https://app.scorehub.cn/merchant/login";
    try { await navigator.clipboard.writeText(text); btn.textContent = "已复制"; }
    catch { btn.textContent = "复制失败"; }
    setTimeout(()=>{ btn.textContent = "复制"; }, 1200);
  };
});

$("go").onclick = go;
load();
</script>
</body>
</html>
